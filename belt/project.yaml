# CheckurAI conveyor belt: Atech 14-port board + DC motor module.
# The laptop drives it: board.call("dc_motor_speed", -255..255), "dc_motor_stop", "dc_motor_brake".
# PORT IS A PLACEHOLDER: plug the motor in, run `atech check`, set the real port, rebuild (seconds).
name: belt
board: 14port
feedback: false
modules:
  - {id: dc_motor, instance: dc_motor, port: 1}
