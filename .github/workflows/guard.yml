name: repo-guard
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Tracked files (secrets, personal data, forbidden or big files)
        run: python tools/repo_guard.py tree
      - name: Every commit on every branch (incl. noreply author emails)
        run: |
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          python tools/repo_guard.py history
      - name: Gitleaks secret scan (full history)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
